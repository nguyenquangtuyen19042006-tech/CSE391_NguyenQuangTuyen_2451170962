<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>

    <link rel="stylesheet" href="responsive.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">ShopNow</div>

        <!-- Hamburger -->
        <div class="hamburger">☰</div>

        <!-- Navigation -->
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- TABLET SIDEBAR -->
    <section class="tablet-filter">
        <select>
            <option>All Products</option>
            <option>Shoes</option>
            <option>Phones</option>
            <option>Fashion</option>
        </select>
    </section>

    <!-- MAIN LAYOUT -->
    <main class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h2>Filters</h2>

            <ul>
                <li>All Products</li>
                <li>Shoes</li>
                <li>Phones</li>
                <li>Fashion</li>
                <li>Laptops</li>
            </ul>
        </aside>

        <!-- PRODUCT GRID -->
        <section class="products">

            <!-- CARD 1 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?1" alt="">
                <h3>Product 1</h3>
                <p>$50</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 2 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?2" alt="">
                <h3>Product 2</h3>
                <p>$70</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 3 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?3" alt="">
                <h3>Product 3</h3>
                <p>$90</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 4 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?4" alt="">
                <h3>Product 4</h3>
                <p>$120</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 5 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?5" alt="">
                <h3>Product 5</h3>
                <p>$140</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 6 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?6" alt="">
                <h3>Product 6</h3>
                <p>$180</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 7 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?7" alt="">
                <h3>Product 7</h3>
                <p>$200</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 8 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?8" alt="">
                <h3>Product 8</h3>
                <p>$250</p>
                <button>Buy Now</button>
            </div>

        </section>

        <!-- ADS BAR -->
        <aside class="ads">
            <h2>Ads</h2>
            <p>Special Offer!</p>
        </aside>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Responsive Product Page</p>
    </footer>

</body>

</html>
