<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Weather App</h1>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Nhập tên thành phố">
            <button id="searchBtn">Tìm</button>
        </div>

        <div id="loading" class="hidden">
             Đang tải...
        </div>

        <div id="error" class="hidden"></div>

        <div id="weather" class="hidden">
            <h2 id="cityName"></h2>
            <p>Nhiệt độ: <span id="temp"></span>°C</p>
            <p>Độ ẩm: <span id="humidity"></span>%</p>
            <p>Mô tả: <span id="desc"></span></p>
            <img id="icon" width="80">
        </div>

        <h3>Lịch sử tìm kiếm</h3>
        <ul id="history"></ul>
    </div>

    <script src="main.js"></script>
</body>
</html>
